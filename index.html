<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiniMessenger — demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">MiniMessenger</div>
      <div class="profile" id="profileBlock">
        <img id="profileAvatar" src="" alt="avatar" class="avatar small" />
        <div>
          <div id="profileName">Гость</div>
          <div class="muted" id="profilePhone"></div>
        </div>
      </div>

      <div class="search">
        <input id="searchInput" placeholder="Поиск или начать новый чат" />
      </div>

      <ul id="chatsList" class="chats"></ul>

      <div class="sidebar-footer">
        <button id="newChatBtn">Новый чат</button>
        <label class="toggle">
          <input type="checkbox" id="useServer" />
          <span>Использовать сервер WS</span>
        </label>
      </div>
    </aside>

    <main class="chat-area">
      <div class="chat-header" id="chatHeader">
        <div class="chat-info">
          <img id="chatAvatar" class="avatar" src="" alt="avatar" />
          <div>
            <div id="chatTitle">Выберите чат</div>
            <div class="muted" id="chatSubtitle"></div>
          </div>
        </div>
      </div>

      <div id="messages" class="messages"></div>

      <div class="composer">
        <input id="fileInput" type="file" accept="image/*" style="display:none" />
        <button id="attachBtn" title="Прикрепить изображение">📎</button>
        <textarea id="messageInput" placeholder="Напишите сообщение..." rows="1"></textarea>
        <button id="sendBtn">Отправить</button>
      </div>
    </main>
  </div>

  <!-- Simple modal for new-contact / profile setup -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modalTitle">Настройка профиля</h3>
      <label>Имя
        <input id="modalName" />
      </label>
      <label>Телефон
        <input id="modalPhone" />
      </label>
      <div class="modal-actions">
        <button id="modalCancel">Отмена</button>
        <button id="modalSave">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
